<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>START2WAY — Dashboard Employeur</title>
  <meta name="description" content="Tableau de bord employeur START2WAY — Gérez vos conducteurs, documents, flotte et rapports DREAL." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="docs/s1/js/s2w-localstorage.js"></script>
  <script src="docs/s1/js/s2w-utils.js"></script>
  <style>
    /* ─── TOKENS ────────────────────────────────────────────────────── */
    :root {
      --navy:        #0D2242;
      --navy-light:  #1a3460;
      --navy-dark:   #07162b;
      --brand-green:       #009A44;
      --brand-green-light: #26B462;
      --paper:       #F8F6F3;
      --white:       #FFFFFF;
      --text-main:   #1A1A1A;
      --text-sec:    #5A5A5A;
      --border:      #E0DDD8;
      --success:     #2E7D32;
      --success-bg:  #E8F5E9;
      --warning:     #ED6C02;
      --warning-bg:  #FFF3E0;
      --danger:      #D32F2F;
      --danger-bg:   #FFEBEE;
      --info:        #1565C0;
      --info-bg:     #E3F2FD;
      --muted:       #F0EDE8;
      --radius:      12px;
      --radius-sm:   8px;
      --shadow:      0 2px 8px rgba(13,34,66,0.08);
      --shadow-md:   0 6px 20px rgba(13,34,66,0.12);
      --transition:  0.22s ease;
      --sidebar-w:   240px;
      --font-head:   'Lexend', sans-serif;
      --font-body:   'Source Sans 3', sans-serif;
    }
    /* ─── RESET ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body { font-family: var(--font-body); background: var(--paper); color: var(--text-main); min-height: 100vh; }

    /* ─── LAYOUT ────────────────────────────────────────────────────── */
    .app-wrapper { display: flex; min-height: 100vh; }

    /* ─── SIDEBAR ────────────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w); background: var(--navy);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; height: 100vh; z-index: 50;
    }
    .sidebar-header { padding: 24px 20px 20px; }
    .sidebar-logo {
      display: flex; justify-content: center; align-items: center;
      margin-bottom: 12px;
    }
    .logo-mark {
      width: 36px; height: 36px; background: var(--brand-green); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-size: 14px; font-weight: 700; color: var(--white);
    }
    .logo-text { font-family: var(--font-head); font-size: 17px; font-weight: 600; color: var(--white); }
    .sidebar-company {
      font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px;
      padding-left: 46px;
    }
    .sidebar-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }
    .sidebar-section-label {
      padding: 12px 20px 4px;
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      color: rgba(255,255,255,0.35); text-transform: uppercase; font-family: var(--font-head);
    }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 0 10px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: var(--radius-sm);
      cursor: pointer; border: none; background: none; width: 100%;
      text-align: left; font-family: var(--font-body); font-size: 14px;
      color: rgba(255,255,255,0.65);
      transition: background var(--transition), color var(--transition);
      margin-bottom: 2px; position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: var(--white); }
    .nav-item.active { background: rgba(201,146,47,0.2); color: var(--white); }
    .nav-item.active::before {
      content: '';
      position: absolute; left: 0; top: 6px; bottom: 6px;
      width: 3px; background: var(--brand-green); border-radius: 0 2px 2px 0;
    }
    .nav-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }
    .nav-badge {
      margin-left: auto; background: var(--danger); color: var(--white);
      font-size: 10px; font-weight: 700; font-family: var(--font-head);
      padding: 2px 7px; border-radius: 20px; min-width: 20px; text-align: center;
    }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
    .user-chip { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 32px; height: 32px; background: var(--brand-green); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-size: 12px; font-weight: 700; color: var(--white);
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; font-weight: 600; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 11px; color: rgba(255,255,255,0.5); }
    .logout-btn {
      background: none; border: none; color: rgba(255,255,255,0.4);
      cursor: pointer; font-size: 16px; padding: 4px;
      transition: color var(--transition);
    }
    .logout-btn:hover { color: var(--danger); }

    /* ─── TOPBAR ────────────────────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: var(--sidebar-w); right: 0;
      height: 60px; background: var(--white); z-index: 40;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px; gap: 16px;
      box-shadow: 0 1px 4px rgba(13,34,66,0.06);
    }
    .topbar-breadcrumb {
      flex: 1; font-family: var(--font-head); font-size: 15px; font-weight: 600;
      color: var(--navy);
    }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .topbar-icon-btn {
      width: 36px; height: 36px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--white);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: border-color var(--transition), background var(--transition);
      position: relative;
    }
    .topbar-icon-btn:hover { border-color: var(--navy); background: var(--muted); }
    .topbar-icon-btn .notif-dot {
      position: absolute; top: 5px; right: 5px;
      width: 7px; height: 7px; background: var(--danger); border-radius: 50%;
      border: 2px solid var(--white);
    }
    .btn {
      border: none; cursor: pointer; border-radius: var(--radius-sm);
      padding: 8px 16px; font-family: var(--font-head); font-size: 13px; font-weight: 600;
      transition: background var(--transition), transform var(--transition);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-brand-green { background: var(--brand-green); color: var(--white); }
    .btn-brand-green:hover { background: var(--brand-green-light); }
    .btn-secondary { background: var(--muted); color: var(--text-main); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-navy { background: var(--navy); color: var(--white); }
    .btn-navy:hover { background: var(--navy-light); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }

    /* ─── MAIN CONTENT ──────────────────────────────────────────────── */
    .main-content {
      margin-left: var(--sidebar-w); margin-top: 60px;
      padding: 24px; min-height: calc(100vh - 60px);
    }

    /* ─── KPI CARDS ────────────────────────────────────────────────── */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px;
      box-shadow: var(--shadow); transition: box-shadow var(--transition), transform var(--transition);
    }
    .kpi-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .kpi-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .kpi-icon { font-size: 22px; }
    .kpi-trend { font-size: 11px; font-weight: 600; font-family: var(--font-head); }
    .kpi-trend.up   { color: var(--success); }
    .kpi-trend.down { color: var(--danger); }
    .kpi-value { font-family: var(--font-head); font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1; }
    .kpi-label { font-size: 13px; color: var(--text-sec); margin-top: 4px; }

    /* ─── PAGE HEADER ──────────────────────────────────────────────── */
    .page-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 20px; gap: 16px; flex-wrap: wrap;
    }
    .page-title { font-family: var(--font-head); font-size: 22px; font-weight: 700; color: var(--navy); }
    .page-subtitle { font-size: 13px; color: var(--text-sec); margin-top: 2px; }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ─── FILTERS / SEARCH ─────────────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .filter-group { display: flex; gap: 6px; }
    .filter-btn {
      border: 1px solid var(--border); background: var(--white);
      border-radius: var(--radius-sm); padding: 6px 14px;
      font-family: var(--font-body); font-size: 13px; cursor: pointer;
      transition: var(--transition); color: var(--text-main);
    }
    .filter-btn:hover { border-color: var(--navy); }
    .filter-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .search-input {
      flex: 1; min-width: 200px; max-width: 300px;
      padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: var(--font-body); font-size: 13px; background: var(--white);
      transition: border-color var(--transition);
    }
    .search-input:focus { outline: none; border-color: var(--navy); }

    /* ─── TABLE ────────────────────────────────────────────────────── */
    .table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table thead th {
      background: var(--muted); padding: 10px 14px;
      text-align: left; font-family: var(--font-head); font-size: 11px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-sec); border-bottom: 1px solid var(--border);
    }
    .data-table tbody tr { border-bottom: 1px solid var(--border); transition: background var(--transition); }
    .data-table tbody tr:last-child { border-bottom: none; }
    .data-table tbody tr:hover { background: rgba(13,34,66,0.025); }
    .data-table td { padding: 12px 14px; vertical-align: middle; font-size: 13px; }
    .data-table .name-cell strong { font-size: 14px; color: var(--text-main); display: block; }
    .data-table .name-cell small { font-size: 11px; color: var(--text-sec); }
    .actions-cell { display: flex; gap: 4px; }
    .action-btn {
      width: 30px; height: 30px; border: 1px solid var(--border);
      background: var(--white); border-radius: var(--radius-sm);
      cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition); color: var(--text-main);
    }
    .action-btn:hover { border-color: var(--navy); background: var(--muted); }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ─── BADGE ────────────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; font-family: var(--font-head);
      white-space: nowrap; letter-spacing: 0.2px;
    }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-danger  { background: var(--danger-bg);  color: var(--danger); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-muted   { background: var(--muted); color: var(--text-sec); }
    .badge-info    { background: var(--info-bg); color: var(--info); }
    .badge-navy    { background: rgba(13,34,66,0.08); color: var(--navy); }

    /* ─── CARDS (flotte) ────────────────────────────────────────────── */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 14px; }
    .vehicle-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      cursor: pointer; box-shadow: var(--shadow);
      transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
    }
    .vehicle-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--navy); }
    .vehicle-card:active { transform: scale(0.99); }
    .vc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .vc-plate { font-family: var(--font-head); font-size: 16px; font-weight: 700; color: var(--navy); letter-spacing: 1px; }
    .vc-model { font-size: 13px; color: var(--text-sec); margin-bottom: 10px; }
    .vc-meta { display: flex; gap: 10px; font-size: 12px; color: var(--text-sec); flex-wrap: wrap; }
    .vc-meta-item { display: flex; align-items: center; gap: 4px; }
    .vc-docs { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .vc-doc-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .vc-doc-label { color: var(--text-sec); }

    /* ─── TABS INLINE ───────────────────────────────────────────────── */
    .tabs-row {
      display: flex; gap: 4px; margin-bottom: 16px;
      border-bottom: 1px solid var(--border); padding-bottom: 0;
    }
    .tab-btn {
      padding: 10px 18px; border: none; background: none; cursor: pointer;
      font-family: var(--font-body); font-size: 14px; color: var(--text-sec);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color var(--transition), border-color var(--transition);
    }
    .tab-btn:hover { color: var(--navy); }
    .tab-btn.active { color: var(--navy); border-bottom-color: var(--brand-green); font-weight: 600; }

    /* ─── RAPPORT ───────────────────────────────────────────────────── */
    .report-form-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-sec); font-family: var(--font-head); text-transform: uppercase; letter-spacing: 0.4px; }
    .form-control {
      padding: 9px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: var(--font-body); font-size: 14px; background: var(--white);
      transition: border-color var(--transition);
    }
    .form-control:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(13,34,66,0.08); }
    .form-control.input-error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(211,47,47,0.1); }
    select.form-control { cursor: pointer; }
    .hash-card {
      background: var(--navy-dark); border-radius: var(--radius); padding: 20px;
      margin-top: 16px;
    }
    .hash-label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .hash-value {
      font-family: 'Courier New', monospace; font-size: 14px; color: var(--brand-green-light);
      word-break: break-all; line-height: 1.5;
      background: rgba(255,255,255,0.05); padding: 12px; border-radius: 6px;
      cursor: pointer; transition: background var(--transition);
    }
    .hash-value:hover { background: rgba(255,255,255,0.1); }
    .hash-meta { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 8px; line-height: 1.4; }
    .hash-actions { display: flex; gap: 8px; margin-top: 12px; }
    .hash-btn {
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
      color: var(--white); border-radius: var(--radius-sm); padding: 6px 14px;
      font-size: 12px; cursor: pointer; font-family: var(--font-head); font-weight: 600;
      transition: background var(--transition);
    }
    .hash-btn:hover { background: rgba(255,255,255,0.15); }
    .progress-bar-wrap {
      height: 4px; background: var(--muted); border-radius: 2px; overflow: hidden; margin-top: 12px;
    }
    .progress-bar { height: 100%; background: var(--brand-green); border-radius: 2px; transition: width 0.1s linear; }

    /* ─── STEPPER ───────────────────────────────────────────────────── */
    .stepper { display: flex; align-items: center; margin-bottom: 24px; }
    .step-dot {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--muted); border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-size: 11px; font-weight: 700;
      color: var(--text-sec); transition: var(--transition); flex-shrink: 0;
    }
    .step-dot.active { background: var(--navy); border-color: var(--navy); color: var(--white); }
    .step-dot.done   { background: var(--success); border-color: var(--success); color: var(--white); }
    .step-line { flex: 1; height: 2px; background: var(--border); margin: 0 6px; }
    .form-section { display: none; }
    .form-section.active { display: block; }
    .section-title { font-family: var(--font-head); font-size: 16px; font-weight: 600; color: var(--navy); margin-bottom: 16px; }
    .security-notice {
      background: var(--info-bg); border: 1px solid rgba(21,101,192,0.2);
      border-radius: var(--radius-sm); padding: 10px 14px;
      font-size: 13px; color: var(--info); margin-bottom: 16px;
    }
    .strength-wrap { margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .strength-bar { flex: 1; height: 4px; background: var(--muted); border-radius: 2px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; }
    .strength-label { font-size: 11px; font-weight: 600; }
    .checkbox-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .checkbox-row input { margin-top: 2px; flex-shrink: 0; width: 16px; height: 16px; cursor: pointer; }
    .checkbox-row label { font-size: 13px; color: var(--text-sec); cursor: pointer; line-height: 1.4; }
    .checkbox-row a { color: var(--brand-green); font-weight: 600; }
    .modal-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
    .password-strength { margin-top: 6px; }

    /* ─── MODAL OVERLAY ─────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(7,22,43,0.55);
      z-index: 100; display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--white); border-radius: 16px;
      padding: 28px 28px 24px;
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: fadeInUp 0.3s ease;
    }
    .modal-box-lg { max-width: 680px; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-title { font-family: var(--font-head); font-size: 18px; font-weight: 700; color: var(--navy); }
    .modal-close {
      width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 50%;
      background: var(--white); cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition); color: var(--text-sec);
    }
    .modal-close:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

    /* ─── ALERT ENTRIES (dashboard) ─────────────────────────────────── */
    .alert-list { display: flex; flex-direction: column; gap: 8px; }
    .alert-entry {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 14px;
      display: flex; align-items: flex-start; gap: 10px;
      box-shadow: var(--shadow);
    }
    .alert-entry.critical { border-left: 4px solid var(--danger); }
    .alert-entry.warning  { border-left: 4px solid var(--warning); }
    .alert-icon { font-size: 18px; flex-shrink: 0; }
    .alert-msg { flex: 1; font-size: 13px; line-height: 1.4; color: var(--text-main); }
    .alert-ts  { font-size: 11px; color: var(--text-sec); margin-top: 2px; }
    .alert-ack { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; color: var(--text-sec); transition: var(--transition); }
    .alert-ack:hover { background: var(--success-bg); color: var(--success); border-color: var(--success); }

    /* ─── ARCHIVE ITEM ──────────────────────────────────────────────── */
    .archive-item {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; box-shadow: var(--shadow);
    }
    .archive-type { font-weight: 600; color: var(--navy); flex-shrink: 0; text-transform: capitalize; min-width: 120px; }
    .archive-owner { color: var(--text-sec); flex: 1; }

  function checkEmployerMidnightAutoCut() {
    const sessions = S2W.table('sessions') || [];
    const todayStr = new Date().toISOString().slice(0, 10);
    let updatedAny = false;

    sessions.forEach(sess => {
      if (sess.status === 'active' && sess.date < todayStr) {
        sess.stopped_at = sess.date + 'T23:59:59Z';
        sess.status = 'closed';
        S2W.update('sessions', sess.id, sess);

        const feuillets = S2W.table('feuillets') || [];
        const existingF = feuillets.find(f => f.session_id === sess.id);
        if (!existingF) {
          const start = new Date(sess.started_at);
          const end = new Date(sess.stopped_at);
          const totalSec = Math.max(0, Math.floor((end - start) / 1000));
          
          const total_a_sec = Math.min(totalSec, 4 * 3600);
          const total_b_sec = Math.min(totalSec - total_a_sec, 2 * 3600);
          const total_c_sec = Math.min(totalSec - total_a_sec - total_b_sec, 1 * 3600);
          const total_d_sec = Math.max(0, 86400 - (total_a_sec + total_b_sec + total_c_sec));
          
          const fmt = (sec) => S2WUtils.fmtDuration(sec);
          
          S2W.push('feuillets', {
            id: S2WUtils.uid('feu'),

  function startPagePolling() {
    if (_pollingInterval) clearInterval(_pollingInterval);
    _pollingInterval = setInterval(async () => {
      const main = document.getElementById('main-content');
      if (!main) return;

      // Do not poll if a modal is open or if user is typing search/inputs to avoid losing focus
      const modal = document.getElementById('main-modal');
      const hasOpenModal = modal && modal.classList.contains('open');
      const searchActive = document.activeElement && (
        document.activeElement.id === 'reg-search' || 
        document.activeElement.id === 'registre-search' || 
        document.activeElement.id === 'rp-drivers' ||
        document.activeElement.id === 'chat-input'
      );

      if (hasOpenModal || searchActive) return;

      // Visual feedback: brief transition to 'Syncing...' state
      const dot = document.getElementById('sync-dot');
      const txt = document.getElementById('sync-text');
      if (dot && txt) {
        dot.style.background = '#ED6C02';
        txt.textContent = 'Sync... ⏳';
      }

      await S2W.syncFromAirtable();

      setTimeout(() => {
        const builders = {
          dashboard: buildDashboard,
          registre:  renderRegistreTable,
          documents: () => renderDocTab(_docTab),
          flotte:    buildFlotte,
          archives:  () => renderArchiveTab(_archiveTab),
          messagerie: buildMessagerie,
          codes:     buildCodes
        };

        if (_activePage === 'dashboard' && builders.dashboard) {
          builders.dashboard(main);
        } else if (_activePage === 'registre' && builders.registre) {
          builders.registre();
        } else if (_activePage === 'documents' && builders.documents) {
          builders.documents();
        } else if (_activePage === 'flotte' && builders.flotte) {
          builders.flotte(main);
        } else if (_activePage === 'archives' && builders.archives) {
          builders.archives();
        } else if (_activePage === 'messagerie' && builders.messagerie) {
          builders.messagerie(main);
        } else if (_activePage === 'codes' && builders.codes) {
          builders.codes(main);
        }

        // Proactively refresh sidebar counts
        const users = S2W.table('users');
        const docs = S2W.table('documents');
        const nbBloque = document.getElementById('nb-bloque');
        const nbDocs = document.getElementById('nb-docs');
        if (nbBloque) nbBloque.textContent = users.filter(u => u.status === 'bloque').length;
        if (nbDocs) {
          const expiredDocs = docs.filter(d => {
            const diff = (new Date(d.expires_at) - new Date()) / 86400000;
            return diff < 0;
          }).length;
          nbDocs.textContent = expiredDocs;
        }
        updateUnreadMessageBadge();

        if (dot && txt) {
          dot.style.background = '#2E7D32';
          txt.textContent = 'Live 🟢';
        }
      }, 300);
    }, 15000);
  }

    const messages = S2W.table('messages') || [];
    
    let leftHtml = '';
    users.forEach(u => {
      const userMsgs = messages.filter(m => m.sender_id === u.id || m.receiver_id === u.id);
      const lastMsg = userMsgs[userMsgs.length - 1];
      const lastTxt = lastMsg ? (lastMsg.text.length > 25 ? lastMsg.text.slice(0, 22) + '...' : lastMsg.text) : 'Aucun message';
      const unreadCount = userMsgs.filter(m => m.sender_id === u.id && !m.is_read).length;

    const activeMsgs = messages.filter(m => m.sender_id === _activeChatUserId || m.receiver_id === _activeChatUserId);
    
    let updated = false;
    messages.forEach(m => {
      if (m.sender_id === _activeChatUserId && !m.is_read) {

    const input = document.getElementById('chat-reply-input');
    if (!input) return;
    const txt = input.value.trim();
    if (!txt) return;
    
    input.value = '';
    
    const msg = {
      id: S2WUtils.uid('msg'),
      sender_id: 'gerant',
      receiver_id: _activeChatUserId,
      text: txt,
      timestamp: new Date().toISOString(),
      is_read: false

    reports = reports.filter(r => r.type === 'circuit');
    
    function getDriverName(userId) {
      if (userId === 'usr_001') return 'Chauffeur Démo';
      if (userId === 'usr_mock_2') return 'Jean Dupont';
      if (userId === 'usr_mock_3') return 'Karim Benzema';
      const u = S2W.find('users', userId);
      return u ? `${u.first_name || ''} ${u.last_name || ''}`.trim() : 'Conducteur Inconnu';
    }

    let filtered = reports.filter(r => {
      const name = getDriverName(r.user_id).toLowerCase();
      const matchSearch = name.includes(circuitSearchText.toLowerCase());
      
      let matchDate = true;
      if (circuitFilterDate === 'today') {
        const todayStr = new Date().toISOString().slice(0, 10);
        matchDate = r.created_at.slice(0, 10) === todayStr;
      } else if (circuitFilterDate === 'week') {
        const diff = new Date() - new Date(r.created_at);
        matchDate = diff < 7 * 86400 * 1000;
      }
      
      let matchPerf = true;
      if (circuitFilterPerf === 'high') {
        matchPerf = r.success_rate >= 90;
      } else if (circuitFilterPerf === 'low') {
        matchPerf = r.success_rate < 80;
      }
      
      return matchSearch && matchDate && matchPerf;
    });

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="grid-column: span 3; padding: 40px; text-align: center; color: var(--text-sec);">
          <span style="font-size:32px;">🔍</span><br>Aucun rapport ne correspond à vos critères.
        </div>
      `;
      return;
    }

    container.innerHTML = filtered.map(r => {
      const name = getDriverName(r.user_id);
      const formattedDate = new Date(r.created_at).toLocaleDateString('fr-FR', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
      });
      const badgeCls = r.success_rate >= 90 ? 'high' : r.success_rate >= 70 ? 'mid' : 'low';
      
      return `
        <div class="circuit-report-card" onclick="openCircuitReportDetail('${r.id}')">
          <div class="cr-card-header">
            <div>
              <div class="cr-card-driver">${name}</div>
              <div class="cr-card-date">${formattedDate}</div>
            </div>
            <span class="cr-card-badge ${badgeCls}">${r.success_rate}%</span>
          </div>
          
          <div class="cr-card-metrics">
            <div>
              <div class="cr-card-metric-val">${r.stops_count}</div>
              <div class="cr-card-metric-lbl">Arrêts</div>
            </div>
            <div>
              <div class="cr-card-metric-val">${r.total_time}m</div>
              <div class="cr-card-metric-lbl">Durée</div>
            </div>
            <div>
              <div class="cr-card-metric-val">${r.total_distance}</div>
              <div class="cr-card-metric-lbl">km</div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function buildCircuitSVGMap(stops) {
    let dots = '';
    let pathPoints = '';
    const colors = {
      delivered: 'var(--success)',
      failed: 'var(--danger)',
      pending: 'var(--navy-light)'
    };
    
    stops.forEach((s, idx) => {
      const x = 50 + (idx * 60) % 300;
      const y = 30 + (idx * 30) % 120;
      pathPoints += `${x},${y} `;
      
      const pinColor = colors[s.status] || colors.pending;
      dots += `
        <circle cx="${x}" cy="${y}" r="6" fill="${pinColor}" stroke="#fff" stroke-width="2" />
        <text x="${x}" y="${y - 10}" font-size="10" font-weight="700" fill="var(--navy)" text-anchor="middle">${idx + 1}</text>
      `;
    });
    
    return `
      <svg viewBox="0 0 400 180" style="width:100%; height:100%;">
        <polyline points="${pathPoints}" fill="none" stroke="var(--border)" stroke-width="3" stroke-dasharray="5,5" />
        ${dots}
      </svg>
    `;
  }

  function buildCodes(el) {
    const invs = S2W.table('invitations') || [];

    // Calcul des statistiques de l'abonnement
    const activeUsersCount = users.filter(u => u.role === 'salarie' && u.status === 'actif').length;

    const bannerSupp = Math.max(0, activeUsersCount - 2);
    const bannerSuppCost = bannerSupp * 2.99;
    
    // Calcul de l'optimisation Circuit
    const activeCircuits = invs.filter(i => {
      if (i.type !== 'circuit' || i.status !== 'used') return false;
      if (i.expires_at === null || i.expires_at === 'null') return true;
      return new Date(i.expires_at) > new Date();
    });
    const activeCircuitCount = activeCircuits.length;
    const paidCircuits = Math.max(0, activeCircuitCount - 2);
    const costCircuits = paidCircuits * 7.99;

    // Filtre des invitations
    const invitationInvs = invs.filter(i => i.type === 'invitation' || i.type === 'usage_unique' || !i.type);
    const invRows = invitationInvs.map(i => {
      const isExpired = i.expires_at ? new Date(i.expires_at) < new Date() : false;
      let statLabel = 'Actif';
      let statClass = 'badge-success';
      if (i.status === 'used') {
        statLabel = 'Utilisé';
        statClass = 'badge-muted';
      } else if (isExpired) {
        statLabel = 'Expiré';
        statClass = 'badge-danger';
      } else if (i.code.includes('LANC')) {
        statLabel = 'En attente de liaison';
        statClass = 'badge-warning';
      }
      
      const u = i.used_by_user_id ? S2W.find('users', i.used_by_user_id) : null;
      const salName = u ? S2WUtils.fullName(u) : (i.driver_name || (i.code.includes('LANC') ? 'En attente de liaison' : '—'));
      const contactText = u ? (u.email || u.phone || '') : '';
      const contactHtml = contactText ? `<div style="font-size:11px;color:var(--text-sec);font-weight:normal;margin-top:2px;">${contactText}</div>` : '';
      const expiryText = i.expires_at ? S2WUtils.fmtDatetime(i.expires_at) : 'Jamais (Offre)';
      const createdText = i.created_at ? S2WUtils.fmtDatetime(i.created_at) : '—';
      
      return `
        <tr>
          <td><strong>${salName}</strong>${contactHtml}</td>
          <td style="font-family:monospace;font-weight:600">${i.code}</td>
          <td><span class="badge ${statClass}">${statLabel}</span></td>
          <td>${createdText}</td>
          <td>${expiryText}</td>
        </tr>
      `;
    }).join('');

    // Filtre des codes Circuit
    const cirInvs = invs.filter(i => i.type === 'circuit');
    const cirRows = cirInvs.map(i => {
      const isExpired = i.expires_at ? new Date(i.expires_at) < new Date() : false;
      let statLabel = 'Actif';
      let statClass = 'badge-success';
      if (i.status === 'used') {
        if (i.expires_at && isExpired) {
          statLabel = 'Expiré';
          statClass = 'badge-danger';
        } else {
          statLabel = 'Utilisé';
          statClass = 'badge-muted';
        }
      }
      
      const u = (i.used_by_user_id ? S2W.find('users', i.used_by_user_id) : null) || (i.target_user_id ? S2W.find('users', i.target_user_id) : null);
      const salName = u ? S2WUtils.fullName(u) : (i.driver_name || '—');
      const contactText = u ? (u.email || u.phone || '') : '';
      const contactHtml = contactText ? `<div style="font-size:11px;color:var(--text-sec);font-weight:normal;margin-top:2px;">${contactText}</div>` : '';
      const createdText = i.created_at ? S2WUtils.fmtDatetime(i.created_at) : '—';
      const usedText = i.used_at ? S2WUtils.fmtDatetime(i.used_at) : '—';
      
      let expiryText = '';
      if (i.status === 'used') {
        expiryText = i.expires_at ? S2WUtils.fmtDatetime(i.expires_at) : 'Jamais (Offre)';
      }
      
      return `
        <tr>
          <td><strong>${salName}</strong>${contactHtml}</td>
          <td style="font-family:monospace;font-weight:600">${i.code}</td>
          <td><span class="badge ${statClass}">${statLabel}</span></td>
          <td>${createdText}</td>
          <td>${usedText}</td>
          <td>${expiryText}</td>
        </tr>

    const repRows = reps.map(r => {

      const statClass = r.status === 'used' ? 'badge-muted' : isExpired ? 'badge-danger' : 'badge-success';

      return `
        <tr>
          <td><strong>${uName}</strong>${contactHtml}</td>
          <td style="font-family:monospace;font-weight:600">${r.code}</td>
          <td><span class="badge ${statClass}">${statLabel}</span></td>
          <td>${S2WUtils.fmtDatetime(r.created_at)}</td>
          <td>${S2WUtils.fmtDatetime(r.expires_at)}</td>

        <span>📊</span>

          <strong>Statut de l'abonnement :</strong> 
          Salariés inclus : <strong>${bannerInclus}/2</strong> utilisés — 
          Salariés supplémentaires actifs : <strong>${bannerSupp}</strong> (+${bannerSuppCost.toFixed(2).replace('.', ',')}€ HT/mois) — 
          Circuit actif : <strong>${activeCircuitCount}</strong> salarié(s) (+${costCircuits.toFixed(2).replace('.', ',')}€ HT/mois)
        </div>
      </div>

      <!-- Section 1 : Codes d'Invitation -->
      <div style="background:var(--surface);border-radius:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border);padding:20px;margin-bottom:24px">
        <h2 style="font-size:15px;color:var(--navy);font-weight:600;margin:0 0 16px 0;text-align:left;">Codes d'Invitation</h2>
        <div class="table-container" style="overflow-x:auto">
          <table class="table">
            <thead>
              <tr>
                <th>Salarié</th>
                <th>Code</th>
                <th>Statut</th>
                <th>Généré le</th>
                <th>Expire le</th>
              </tr>
            </thead>
            <tbody>
              ${invRows || '<tr><td colspan="5" style="text-align:center;color:var(--text-sec)">Aucun code d\'invitation généré</td></tr>'}
            </tbody>
          </table>
        </div>

      <!-- Section 2 : Codes de Reprise -->

                <th>Code</th>
                <th>Statut</th>

                <th>Expire le</th>
              </tr>
            </thead>
            <tbody>
              ${repRows || '<tr><td colspan="5" style="text-align:center;color:var(--text-sec)">Aucun code de reprise généré</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>

        <h2 style="font-size:15px;color:var(--navy);font-weight:600;margin:0 0 16px 0;text-align:left;">Codes d'Activation Service Circuit (Token_Circuit)</h2>

  function checkDuplicateInvitationName() {
    const lastName = document.getElementById('inv-last-name')?.value.trim().toUpperCase();
    const firstName = document.getElementById('inv-first-name')?.value.trim();
    const warnBox = document.getElementById('inv-warning-box');
    if (!warnBox) return;
    
    if (!lastName || !firstName) {
      warnBox.innerHTML = '';
      return;
    }
    
    const name1 = (lastName + ' ' + firstName).toLowerCase();
    const name2 = (firstName + ' ' + lastName).toLowerCase();
    const users = S2W.table('users') || [];
    
    const exists = users.some(u => {
      const uName = S2WUtils.fullName(u).toLowerCase();
      const uNameAlt = ((u.first_name || '') + ' ' + (u.last_name || '')).toLowerCase();

  function updateRepriseFeuilletOptions() {
    const userId = document.getElementById('rep-driver').value;
    const selectF = document.getElementById('rep-feuillet');
    const btn = document.getElementById('btn-rep-generate');
    
    if (!userId) {
      selectF.innerHTML = '<option value="">Sélectionnez d\'abord un conducteur...</option>';
      selectF.disabled = true;
      return;
    }
    
    const sessions = S2W.table('sessions').filter(s => s.user_id === userId);
    const feuillets = S2W.table('feuillets') || [];
    
    const limitDate = new Date();
    limitDate.setDate(limitDate.getDate() - 6);
    
    const matched = [];
    sessions.forEach(s => {
      const f = feuillets.find(f => f.session_id === s.id);
      if (f) {
        const genDate = new Date(f.generated_at || s.started_at);
        if (genDate >= limitDate) {
          matched.push({ f, s });
        }
      }
    });
    
    if (matched.length === 0) {
      selectF.innerHTML = '<option value="">Aucun feuillet éligible (< 6 jours) trouvé</option>';
      selectF.disabled = true;
      btn.disabled = true;
    } else {
      selectF.innerHTML = matched.map(m => `
        <option value="${m.f.id}">Feuillet du ${S2WUtils.fmtDateShort(m.f.generated_at)} (${m.f.status === 'conforme' ? 'Conforme' : 'Non conforme'})</option>
      `).join('');
      selectF.disabled = false;
      btn.disabled = false;
    }
  }

  function buildDashboard(el) {
    const users = S2W.table('users').filter(u => !u.hidden_at && u.status !== 'supprime');

    const bloques = users.filter(u => u.status === 'bloque').length;
    const docs    = S2W.table('documents');
    const expiredDocs = docs.filter(d => {
      const diff = (new Date(d.expires_at) - new Date()) / 86400000;
      return diff < 0;
    }).length;
    const alerts = S2W.table('alerts').filter(a => !a.resolved_at) || [];
    
    // Vérification des skews d'horloge dans les logs d'événements
    const evts = S2W.table('event_logs') || [];
    evts.forEach(ev => {
      if (Math.abs(ev.device_clock_diff) > 300) { // drift de plus de 5 minutes
        const sess = S2W.find('sessions', ev.session_id);
        const user = sess ? S2W.find('users', sess.user_id) : null;
        const uName = user ? S2WUtils.fullName(user) : 'Conducteur';
        const hoursSkew = (ev.device_clock_diff / 3600).toFixed(1);
        
        alerts.unshift({
          id: ev.id,
          severity: 'critical',
          message: `🚨 Tentative de falsification d'horloge : Le conducteur ${uName} a démarré son shift avec un décalage de +${hoursSkew}h (serveurs de temps NTP décalés).`,
          triggered_at: ev.server_timestamp || ev.local_timestamp
        });
      }
    });

    el.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-header">
            <span class="kpi-icon">👥</span>
            <span class="kpi-trend up">+0</span>
          </div>
          <div class="kpi-value">${actifs}</div>
          <div class="kpi-label">Conducteurs actifs</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-header">
            <span class="kpi-icon">🚚</span>
            <span class="kpi-trend up">8</span>
          </div>
          <div class="kpi-value">8</div>
          <div class="kpi-label">Véhicules en flotte</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-header">
            <span class="kpi-icon">⚠</span>
            <span class="kpi-trend down">+${expiredDocs}</span>
          </div>
          <div class="kpi-value" style="color:var(--danger)">${expiredDocs}</div>
          <div class="kpi-label">Documents expirés</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-header">
            <span class="kpi-icon">🔔</span>
            <span class="kpi-trend down">Actives</span>
          </div>
          <div class="kpi-value" style="color:var(--warning)">${alerts.length}</div>
          <div class="kpi-label">Alertes en cours</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div>
          <h2 style="font-family:var(--font-head);font-size:16px;font-weight:600;color:var(--navy);margin-bottom:14px">
            Alertes actives
          </h2>
          <div class="alert-list">
            ${alerts.slice(0,5).map(a => `
            <div class="alert-entry ${a.severity}" role="alert">
              <span class="alert-icon">${a.severity==='critical'?'🚨':'⚠'}</span>
              <div style="flex:1">
                <div class="alert-msg">${a.message}</div>
                <div class="alert-ts">${S2WUtils.fmtDatetime(a.triggered_at)}</div>
              </div>
              <button class="alert-ack" onclick="ackAlert('${a.id}')">✓ Lu</button>
            </div>`).join('')}
            ${alerts.length === 0 ? '<div class="empty-state">✅ Aucune alerte active</div>' : ''}
          </div>
        </div>
        <div>
          <h2 style="font-family:var(--font-head);font-size:16px;font-weight:600;color:var(--navy);margin-bottom:14px">

                  <td class="name-cell">
                    <strong>${u.last_name} ${u.first_name}</strong>
                    <small>${u.phone || ''}</small>

                  <td><span class="badge badge-navy">${u.license_category}</span></td>

            Voir le registre complet →
          </button>
        </div>
      </div>`;
  }

  function ackAlert(id) {
    if (id.startsWith('evt')) {
      const ev = S2W.find('event_logs', id);
      if (ev) {
        ev.device_clock_diff = 0;
        S2W.update('event_logs', id, ev);
      }
    } else {
      S2W.update('alerts', id, { acknowledged: true, resolved_at: new Date().toISOString() });
    }
    showToast('Alerte marquée comme lue', 'success');
    switchPage('dashboard');
  }

  function renderRapportDaysChecklist() {
    const driverId = document.getElementById('rp-driver').value;
    const monthVal = document.getElementById('rp-month').value;
    const btn = document.getElementById('btn-gen-report');
    const container = document.getElementById('rp-days-checklist');
    
    if (!driverId) {
      container.innerHTML = '<div style="grid-column:1/-1;color:var(--text-sec);text-align:center;font-size:12px">Sélectionnez d\'abord un conducteur.</div>';
      btn.disabled = true;
      return;
    }
    
    btn.disabled = false;
    
    const [year, month] = monthVal.split('-').map(Number);
    const numDays = new Date(year, month, 0).getDate();
    
    const sessions = S2W.table('sessions').filter(s => s.user_id === driverId);
    const feuillets = S2W.table('feuillets') || [];
    const driverFeuilletDates = new Set();
    
    sessions.forEach(s => {
      const f = feuillets.find(f => f.session_id === s.id);
      if (f) {
        const dateStr = s.date || f.generated_at?.slice(0, 10);
        if (dateStr) driverFeuilletDates.add(dateStr);
      }
    });

    let html = '';
    for (let day = 1; day <= numDays; day++) {
      const dayStr = day.toString().padStart(2, '0');
      const fullDateStr = `${monthVal}-${dayStr}`;
      const d = new Date(year, month - 1, day);
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const hasFeuillet = driverFeuilletDates.has(fullDateStr);
      
      const checked = 'checked';
      const dot = hasFeuillet ? '<span style="width:6px;height:6px;background:var(--success);border-radius:50%;display:inline-block;margin-left:4px" title="Feuillet enregistré"></span>' : '';
      const bg = hasFeuillet ? 'background:#E8F5E9;' : isWeekend ? 'background:#FFEBEE;' : '';
      
      html += `
        <label style="display:flex;flex-direction:column;align-items:center;padding:8px;border-radius:6px;border:1px solid #ddd;cursor:pointer;font-size:11px;${bg}">
          <span style="font-weight:700;color:var(--navy);margin-bottom:4px">${dayStr}</span>
          <input type="checkbox" class="rp-day-chk" data-date="${fullDateStr}" ${checked} style="transform:scale(1.1)">
          <div style="display:flex;align-items:center;margin-top:4px">
            <span style="font-size:9px;color:var(--text-sec)">${d.toLocaleDateString('fr-FR', {weekday:'short'})}</span>
            ${dot}
          </div>
        </label>
      `;
    }
    container.innerHTML = html;
  }

  function selectRapportDays(checked) {
    document.querySelectorAll('.rp-day-chk').forEach(chk => {
      chk.checked = checked;
    });
  }

  async function generateDrealReport() {
    const btn = document.getElementById('btn-gen-report');
    const progressWrap = document.getElementById('rp-progress-wrap');
    const progressBar  = document.getElementById('rp-progress');
    if (!btn) return;
    
    const driverId = document.getElementById('rp-driver').value;
    const monthVal = document.getElementById('rp-month').value;
    const company = S2W.table('companies')[0];

    btn.disabled = true;
    btn.textContent = '⏳ Assemblage du rapport...';
    progressWrap.style.display = 'block';

    let pct = 0;
    const progressInterval = setInterval(() => {
      pct = Math.min(pct + Math.random() * 20, 95);
      progressBar.style.width = pct + '%';
    }, 100);

    const checkedBoxes = Array.from(document.querySelectorAll('.rp-day-chk:checked'));
    const includedDates = checkedBoxes.map(chk => chk.dataset.date);
    const allBoxes = Array.from(document.querySelectorAll('.rp-day-chk'));
    const allDates = allBoxes.map(chk => chk.dataset.date);

    const payload = `${driverId}|${monthVal}|${includedDates.join(',')}|${Date.now()}`;
    const hash = await S2W.computeReportHash(company?.id || 'cmp_001', includedDates[0] || '', includedDates[includedDates.length - 1] || '');

    setTimeout(() => {
      clearInterval(progressInterval);
      progressBar.style.width = '100%';
      btn.disabled = false;
      btn.textContent = '📑 Générer le rapport DREAL';

      const report = {
        id: S2WUtils.uid('rpt'),
        company_id: company?.id,
        driver_id: driverId,
        month: monthVal,
        included_dates: includedDates,
        all_dates: allDates,
        hash,
        generated_at: new Date().toISOString(),
        status: 'verrouille'
      };
      
      S2W.push('reports', report);
      window._lastReportHash = hash;
      
      const driver = S2W.find('users', driverId);
      const resContainer = document.getElementById('report-result-section');
      
      resContainer.innerHTML = `
        <div class="hash-card" style="background:#FFFDE7;border:1px solid #FFF59D;border-radius:12px;padding:20px;margin-top:16px">
          <div class="hash-label" style="font-size:10px;text-transform:uppercase;color:var(--text-sec);font-weight:700;letter-spacing:1px">Certificat d'intégrité DREAL (SHA-256)</div>
          <div class="hash-value" id="hash-display" onclick="copyHash()" title="Cliquer pour copier" style="font-family:monospace;font-size:14px;font-weight:700;color:var(--navy);word-break:break-all;margin:10px 0;background:white;padding:12px;border-radius:8px;border:1px solid var(--border);cursor:pointer">
            ${hash}
          </div>
          <div class="hash-meta" style="font-size:11px;color:var(--text-sec)">
            Généré le ${S2WUtils.fmtDatetime(new Date().toISOString())} — Période : ${monthVal}<br>
            Payload : ${driver.last_name} ${driver.first_name} | ${includedDates.length} jours d'activité inclus / ${allDates.length - includedDates.length} jours non-travaillés.
          </div>
          <div class="hash-actions" style="margin-top:16px;display:flex;gap:12px">
            <button class="hash-btn" onclick="copyHash()">⎘ Copier le hash</button>
            <button class="hash-btn" onclick="previewDrealReportPDF('${report.id}')">↓ Prévisualiser & Imprimer le LIC (PDF)</button>
          </div>
        </div>
      `;
    }, 800);
  }

  function previewDrealReportPDF(reportId) {
    const r = S2W.find('reports', reportId);
    if (!r) return;
    
    const driver = S2W.find('users', r.driver_id);
    const company = S2W.find('companies', r.company_id) || { legal_name: 'AMT Transport', siret: '803 492 109 00021' };
    
    const w = window.open('', '_blank');
    if (!w) {
      alert("Veuillez autoriser les fenêtres surgissantes pour afficher le PDF.");
      return;
    }
    
    let pagesHtml = '';
    const allDates = r.all_dates || [];
    
    allDates.forEach((dateStr, idx) => {
      const isIncluded = r.included_dates.includes(dateStr);
      const pageNum = idx + 1;
      
      let bodyHtml = '';
      if (isIncluded) {
        const sessions = S2W.table('sessions').filter(s => s.user_id === r.driver_id);
        const sess = sessions.find(s => s.date === dateStr);
        const feuillets = S2W.table('feuillets') || [];
        const f = sess ? feuillets.find(f => f.session_id === sess.id) : null;
        
        const data = f ? {
          A_sec: f.total_a_sec || 0, B_sec: f.total_b_sec || 0,
          C_sec: f.total_c_sec || 0, D_sec: f.total_d_sec || 0,
          total_a: f.total_a || '0h00', total_b: f.total_b || '0h00',
          total_c: f.total_c || '0h00', total_d: f.total_d || '24h00',
          corrected_at: f.corrected_at,
          observations: f.observations
        } : {
          A_sec: 0, B_sec: 0, C_sec: 0, D_sec: 86400,
          total_a: '0h00', total_b: '0h00', total_c: '0h00', total_d: '24h00'
        };

        const total_e = S2WUtils.fmtDuration((data.A_sec || 0) + (data.B_sec || 0) + (data.C_sec || 0));

        let paths = '';
        let lastX = 0;
        let lastY = 140;
        const rowY = { A: 20, B: 60, C: 100, D: 140 };
        const rowColors = { A: '#0D2242', B: '#1565C0', C: '#ED6C02', D: '#2E7D32' };

        let segments = S2W.table('segments')?.filter(s => s.session_id === sess?.id) || [];
        if (segments.length === 0) {
          const aVal = data.A_sec;
          const bVal = data.B_sec;
          const cVal = data.C_sec;
          const dVal = data.D_sec;
          const d1 = Math.floor(dVal * 0.4);
          const d2 = Math.floor(dVal * 0.1);
          const d3 = Math.max(0, dVal - d1 - d2);
          const a1 = Math.floor(aVal * 0.5);
          const a2 = Math.max(0, aVal - a1);
          
          let current = 0;
          const addSeg = (cat, sec) => {
            if (sec <= 0) return;
            segments.push({
              category: cat,
              started_at: new Date(new Date('2026-08-15T00:00:00Z').getTime() + current * 1000).toISOString(),
              ended_at: new Date(new Date('2026-08-15T00:00:00Z').getTime() + (current + sec) * 1000).toISOString(),
            });
            current += sec;
          };
          addSeg('D', d1);
          addSeg('A', a1);
          addSeg('B', bVal);
          addSeg('D', d2);
          addSeg('A', a2);
          addSeg('C', cVal);
          addSeg('D', d3);
        }

        const getSecs = (isoStr) => {
          const d = new Date(isoStr);
          return d.getUTCHours() * 3600 + d.getUTCMinutes() * 60 + d.getUTCSeconds();
        };

        segments.sort((a,b) => a.started_at.localeCompare(b.started_at)).forEach((s, idx) => {
          const startSec = getSecs(s.started_at);
          const endSec = getSecs(s.ended_at);
          const x1 = (startSec / 86400) * 960;
          const x2 = (endSec / 86400) * 960;
          const y = rowY[s.category] || rowY.D;
          const col = rowColors[s.category] || rowColors.D;

          if (x1 > lastX) {
            paths += `<line x1="${lastX}" y1="${lastY}" x2="${x1}" y2="140" stroke="#2E7D32" stroke-width="3" />`;
            paths += `<line x1="${x1}" y1="140" x2="${x1}" y2="${y}" stroke="${col}" stroke-width="3" stroke-dasharray="2,2" />`;
          } else if (idx > 0 && y !== lastY) {
            paths += `<line x1="${x1}" y1="${lastY}" x2="${x1}" y2="${y}" stroke="${col}" stroke-width="3" />`;
          }
          paths += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="4" />`;
          lastX = x2;
          lastY = y;
        });

        if (lastX < 960) {
          paths += `<line x1="${lastX}" y1="${lastY}" x2="960" y2="140" stroke="#2E7D32" stroke-width="3" />`;
        }

        let gridLines = '';
        for (let h = 0; h <= 24; h++) {
          const x = h * 40;
          const strokeCol = h % 4 === 0 ? '#B0BEC5' : '#ECEFF1';
          gridLines += `<line x1="${x}" y1="0" x2="${x}" y2="160" stroke="${strokeCol}" stroke-width="1" />`;
        }

        const watermarkHtml = data.corrected_at 
          ? `<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:48px;color:rgba(211,47,47,0.12);font-weight:bold;border:6px dashed rgba(211,47,47,0.15);padding:10px 30px;letter-spacing:2px;pointer-events:none;z-index:9">FEUILLET CORRIGÉ</div>`
          : '';

        bodyHtml = `
          ${watermarkHtml}
          <div style="margin-top:20px;border:1px solid #333;padding:12px;background:#f9f9f9;border-radius:6px">
            <h3 style="margin:0 0 10px 0;font-size:14px;color:#0D2242">ACTIVITÉS DE LA JOURNÉE</h3>
            <svg viewBox="0 0 960 160" style="width:100%;height:auto;display:block;background:#FFF;border:1px solid #ccc">
              <rect width="960" height="160" fill="#FFF" />
              ${gridLines}
              ${paths}
              <text x="5" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0D2242">A (Conduite)</text>
              <text x="5" y="65" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1565C0">B (Autre trav.)</text>
              <text x="5" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ED6C02">C (Dispo.)</text>
              <text x="5" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">D (Repos)</text>
            </svg>
          </div>

          <div style="display:grid;grid-template-columns:repeat(5, 1fr);gap:10px;margin-top:20px">
            <div style="border:1px solid #ccc;padding:8px;text-align:center;border-radius:4px">
              <div style="font-size:10px;color:#555">A (Conduite)</div>
              <div style="font-size:14px;font-weight:bold">${data.total_a}</div>
            </div>
            <div style="border:1px solid #ccc;padding:8px;text-align:center;border-radius:4px">
              <div style="font-size:10px;color:#555">B (Autre travail)</div>
              <div style="font-size:14px;font-weight:bold">${data.total_b}</div>
            </div>
            <div style="border:1px solid #ccc;padding:8px;text-align:center;border-radius:4px">
              <div style="font-size:10px;color:#555">C (Disponibilité)</div>
              <div style="font-size:14px;font-weight:bold">${data.total_c}</div>
            </div>
            <div style="border:1px solid #ccc;padding:8px;text-align:center;border-radius:4px">
              <div style="font-size:10px;color:#555">E (Travail = A+B+C)</div>
              <div style="font-size:14px;font-weight:bold">${total_e}</div>
            </div>

  let _archiveTab = 'documents';

  function buildArchives(el) {
    el.innerHTML = `

      </div>
      <div id="archive-content"></div>`;
    renderArchiveTab('documents');

  function switchArchiveTab(tab, btn) {
    _archiveTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
    btn.classList.add('active'); btn.setAttribute('aria-selected','true');
    renderArchiveTab(tab);
  }

  function renderArchiveTab(tab) {
    const container = document.getElementById('archive-content');
    if (!container) return;
    const docs    = S2W.table('documents');
    const reports = S2W.table('reports');

    if (tab === 'documents') {
      const visible = docs.filter(d => !d.hidden_at);
      if (!visible.length) { container.innerHTML = '<div class="empty-state"><span class="empty-icon">📄</span>Aucun document archivé.</div>'; return; }
      container.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px">
        ${visible.map(d => {
          let ownerName = d.owner_id;
          if (d.owner_type === 'vehicle') {
            const v = S2W.find('vehicles', d.owner_id);
            ownerName = v ? v.plate_number : d.owner_id;
          } else {
            const u = S2W.find('users', d.owner_id);
            ownerName = u ? S2WUtils.fullName(u) : d.owner_id;
          }
          return `
          <div class="archive-item">
            <span class="archive-type">${d.type.replace(/_/g,' ')}</span>
            <span class="archive-owner">${d.owner_type === 'vehicle' ? '🚚' : '👤'} ${ownerName}</span>
            ${S2WUtils.badgeExpiry(d.expires_at)}
            <span class="archive-date">${S2WUtils.fmtDateShort(d.created_at)}</span>
            <button class="action-btn" onclick="archiveDoc('${d.id}')" title="Archiver">🗑</button>
          </div>`;
        }).join('')}
      </div>`;
    } else if (tab === 'rapports') {
      if (!reports.length) { container.innerHTML = '<div class="empty-state"><span class="empty-icon">📑</span>Aucun rapport généré.<br><button class="btn btn-brand-green" onclick="switchPage(\'rapports\')" style="margin-top:16px">Générer un rapport DREAL</button></div>'; return; }
      container.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px">
        ${reports.map(r => `
        <div class="archive-item">
          <span class="archive-type">Rapport ${r.period}</span>
          <span class="archive-owner">${r.period_start} → ${r.period_end}</span>
          <span class="badge badge-navy" style="font-size:10px;font-family:monospace">${r.hash?.slice(0,12)}…</span>
          <span class="archive-date">${S2WUtils.fmtDateShort(r.generated_at)}</span>
        </div>`).join('')}
      </div>`;
    } else {
      const trashed = docs.filter(d => d.hidden_at);
      if (!trashed.length) { container.innerHTML = '<div class="empty-state"><span class="empty-icon">🗑</span>Corbeille vide.</div>'; return; }
      container.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px">
        ${trashed.map(d => {
          let ownerName = d.owner_id;
          if (d.owner_type === 'vehicle') {
            const v = S2W.find('vehicles', d.owner_id);
            ownerName = v ? v.plate_number : d.owner_id;
          } else {
            const u = S2W.find('users', d.owner_id);
            ownerName = u ? S2WUtils.fullName(u) : d.owner_id;
          }
          return `
          <div class="archive-item">
            <span class="archive-type">${d.type.replace(/_/g,' ')}</span>
            <span class="archive-owner">${d.owner_type === 'vehicle' ? '🚚' : '👤'} ${ownerName}</span>
            <span class="badge badge-muted">Supprimé le ${S2WUtils.fmtDateShort(d.hidden_at)}</span>
            <button class="btn btn-secondary btn-sm" onclick="restoreDoc('${d.id}')">↩ Restaurer</button>
          </div>`;
        }).join('')}
      </div>`;
    }
  }

  function archiveDoc(id) {
    S2W.softDelete('documents', id);
    showToast('Document déplacé en corbeille');
    renderArchiveTab('documents');
  }
  function restoreDoc(id) {
    S2W.restore('documents', id);
    showToast('Document restauré', 'success');
    renderArchiveTab('corbeille');
  }

  function empNext() {
    if (!validateEmpSection(_empSection)) return;
    if (_empSection === EMP_SECTIONS) { submitEmployerForm(); return; }
    empGoTo(_empSection + 1);
  }
  function empPrev() {
    if (_empSection > 1) empGoTo(_empSection - 1);
  }
  function empGoTo(n) {
    document.getElementById(`emp-s${_empSection}`)?.classList.remove('active');
    const dot = document.getElementById(`sdot-${_empSection}`);
    if (dot) { dot.classList.remove('active'); dot.classList.add('done'); dot.textContent = '✓'; }
    _empSection = n;
    document.getElementById(`emp-s${n}`)?.classList.add('active');
    const newDot = document.getElementById(`sdot-${n}`);
    if (newDot) newDot.classList.add('active');
    document.getElementById('btn-emp-prev').style.display = n > 1 ? '' : 'none';
    document.getElementById('btn-emp-next').textContent = n === EMP_SECTIONS ? 'Créer le compte →' : 'Suivant →';
  }
  function validateEmpSection(n) {
    const section = document.getElementById(`emp-s${n}`);
    let ok = true;
    section?.querySelectorAll('[required]').forEach(inp => {
      inp.classList.remove('input-error');
      const empty = inp.type === 'checkbox' ? !inp.checked : !inp.value.trim();
      if (empty) { inp.classList.add('input-error'); ok = false; }
    });
    if (!ok) showToast('Veuillez remplir tous les champs obligatoires (*)', 'error');
    return ok;
  }
  function formatIbanInput(input) {
    let v = input.value.replace(/\s/g,'').toUpperCase();
    v = v.replace(/(.{4})/g,'$1 ').trim();
    input.value = v;
  }
  function updatePwdStrength(pwd) {
    const s = S2WUtils.passwordStrength(pwd);
    const fill  = document.getElementById('pwd-fill');
    const label = document.getElementById('pwd-label');
    const colors = ['', '#D32F2F','#ED6C02','#2E7D32','#1B5E20'];
    if (fill)  { fill.style.width = (s.score*25)+'%'; fill.style.background = colors[s.score] || ''; }
    if (label) { label.textContent = s.label; label.style.color = colors[s.score] || ''; }
  }
  function submitEmployerForm() {
    const pwd = document.getElementById('f-pwd')?.value;
    const pwd2 = document.getElementById('f-pwd2')?.value;
    if (pwd !== pwd2) { showToast('Les mots de passe ne correspondent pas', 'error'); return; }
    const ibanRaw = document.getElementById('f-iban')?.value.replace(/\s/g,'');
    const company = {
      id: S2WUtils.uid('cmp'),
      legal_name: document.getElementById('f-lname')?.value,
      legal_form: document.getElementById('f-lform')?.value,
      siren: document.getElementById('f-siren')?.value,
      siret: document.getElementById('f-siret')?.value,
      naf_ape: document.getElementById('f-naf')?.value,
      email: document.getElementById('f-cemail')?.value,
      phone: document.getElementById('f-phone')?.value,
      address_street: document.getElementById('f-addr')?.value,
      address_postal_code: document.getElementById('f-postal')?.value,
      address_city: document.getElementById('f-city')?.value,
      address_country: 'France',
      rep_first_name: document.getElementById('f-rfirst')?.value,
      rep_last_name: document.getElementById('f-rlast')?.value,
      rep_function: document.getElementById('f-rrole')?.value,
      account_holder: document.getElementById('f-holder')?.value,
      iban_encoded: S2W.encodeIban(ibanRaw),
      iban_masked: S2W.maskIban(ibanRaw),
      bic_swift: document.getElementById('f-bic')?.value,
      status: 'active', created_at: new Date().toISOString()
    };
    S2W.push('companies', company);
    closeModal();
    showToast(`Compte créé pour ${company.legal_name} — Bienvenue sur START2WAY !`, 'success');
  }

  function genNewCode() {
    const confirmPay = confirm("Générer un Token_Invitation pour un 3e salarié ajoutera 2,99€/mois HT (3,59€/mois TTC) à votre abonnement. Confirmer ?");
    if (!confirmPay) return;

    const code = 'INV-AMT-' + new Date().getFullYear() + '-' +
      Math.random().toString(36).slice(2,6).toUpperCase();
    document.getElementById('gen-code').value = code;
    document.getElementById('sal-code-info').style.display = '';
    document.getElementById('btn-sal-step2').disabled = false;
    window._genCode = code;
    const company = S2W.table('companies')[0] || { id: 'cmp_001' };
    const expiresAt = new Date(Date.now() + 12 * 3600000).toISOString();
    
    S2W.push('invitations', {
      id: S2WUtils.uid('inv'), code, company_id: company.id, type:'invitation',
      created_at: new Date().toISOString(), expires_at: expiresAt,
      used_at: null, status:'pending'
    });
    showToast(`Code ${code} généré et facturé (+2,99 €/mois HT)`, 'success');
  }

  function submitSalarieForm() {
    const last  = document.getElementById('f-sal-last')?.value;
    const first = document.getElementById('f-sal-first')?.value;
    if (!last || !first) { showToast('Nom et prénom requis', 'error'); return; }
    
    const driverType = document.querySelector('input[name="sal-driver-type"]:checked')?.value || 'VL';
    const licVal = document.getElementById('f-sal-lic')?.value || 'B';
    const licNum = document.getElementById('f-sal-lic-num')?.value || 'N/A';
    
    const company = S2W.table('companies')[0] || { id: 'cmp_001' };
    const user = {
      id: S2WUtils.uid('usr'), company_id: company.id,
      last_name: last.toUpperCase(), first_name: first,
      license_category: licVal,
      phone: document.getElementById('f-sal-phone')?.value,
      email: document.getElementById('f-sal-email')?.value,
      role:'salarie', status:'actif', created_at: new Date().toISOString()
    };
    S2W.push('users', user);

    // Permis
    S2W.push('documents', {
      id: S2WUtils.uid('doc'), owner_id: user.id, owner_type: 'user', type: 'permis',
      issued_at: new Date().toISOString().slice(0, 10),
      expires_at: new Date(Date.now() + 5 * 365 * 24 * 3600000).toISOString().slice(0, 10), // +5 ans
      status: 'valide', validated_by_employer: true, hidden_at: null, created_at: new Date().toISOString()
    });

    // VM
    const vmVal = document.getElementById('f-sal-vm')?.value;
    if (vmVal) {
      S2W.push('documents', {
        id: S2WUtils.uid('doc'), owner_id: user.id, owner_type: 'user', type: 'visite_medicale',
        issued_at: new Date().toISOString().slice(0, 10),
        expires_at: vmVal,
        status: new Date(vmVal) > new Date() ? 'valide' : 'expire',
        validated_by_employer: true, hidden_at: null, created_at: new Date().toISOString()
      });
    }

    // FCO
    const fcoVal = document.getElementById('f-sal-fco')?.value;
    if (driverType === 'PL' && fcoVal) {
      S2W.push('documents', {
        id: S2WUtils.uid('doc'), owner_id: user.id, owner_type: 'user', type: 'fco_fimo',
        issued_at: new Date().toISOString().slice(0, 10),
        expires_at: fcoVal,
        status: new Date(fcoVal) > new Date() ? 'valide' : 'expire',
        validated_by_employer: true, hidden_at: null, created_at: new Date().toISOString()
      });
    }

    closeModal();
    showToast(`Conducteur ${first} ${last} enregistré — Statut : Actif`, 'success');
  }

  async function revealIban() {
    const companies = S2W.table('companies');
    const comp = companies[0];
    if (!comp) return;
    
    const input = document.getElementById('me-iban');
    const btn = document.getElementById('btn-reveal-iban');
    const label = document.getElementById('iban-sec-label');
    if (!input || !btn || !label) return;

    if (btn.textContent === '👁️') {
      const checkKms = confirm("Demander le déballage de la clé de données (DEK) auprès du serveur KMS de START2WAY ?");
      if (checkKms) {
        btn.disabled = true;
        btn.textContent = '⏳';
        label.textContent = '🔑 Validation du jeton IAM et déchiffrement de la KEK...';
        
        setTimeout(async () => {
          // SIMULATION DÉMO — déchiffrement réel à faire côté serveur en prod (la clé KEK ne doit jamais être exposée côté client)
          const decrypted = await S2W.decryptIbanEnvelope(comp.iban);
          btn.disabled = false;
          btn.textContent = '🙈';
          input.value = decrypted || 'FR7630006000011234567890123';
          label.innerHTML = '🟢 <strong>Déchiffré via KMS</strong> (DEK déballée à la volée en mémoire, clé KEK valide).';
          showToast('IBAN déchiffré à la volée ✓', 'success');
        }, 1200);
      }
    } else {
      btn.textContent = '👁️';
      let rawVal = comp.iban || '';
      if (rawVal.startsWith('{')) {
        rawVal = S2W.decodeIban(comp.iban_encoded) || 'FR7630006000011234567890123';
      }
      const masked = rawVal.substring(0, 4) + ' ●●●● ●●●● ●●●● ●●●● ' + rawVal.slice(-3);
      input.value = masked;
      label.textContent = '🔒 Donnée bancaire chiffrée par clé d\'enveloppe (AES-GCM).';
    }
  }

    const companies = S2W.table('companies');

    comp.legal_name = document.getElementById('me-legal-name').value;
    comp.trade_name = document.getElementById('me-trade-name').value;

    comp.naf_code   = document.getElementById('me-naf').value;
    comp.tva_number = document.getElementById('me-tva').value;

    comp.phone      = document.getElementById('me-phone').value;
    comp.email      = document.getElementById('me-email').value;
